name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Три платформы с первого дня: разъехавшиеся пути и переносы строк
    # ловятся сейчас, а не в M5 на упаковке.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
