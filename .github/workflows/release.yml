name: Release

# Инсталляторы собирает тег вида `v0.1.0`, и собирает каждый на своей ОС:
# кросс-сборка dmg требует macOS, nsis — Windows или wine, deb — Linux. Ни
# одной из этих подпорок здесь нет намеренно — приложение, собранное под wine,
# проверить нечем.
#
# Релиз создаётся **черновиком** (`releaseType: draft` в electron-builder.yml):
# автообновление (5.4) раздаёт то, что опубликовано, и публиковать сборку,
# которую никто не открывал, значит разослать её всем сразу.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # Черновик заводится **до** сборок и одной джобой. Три сборки, каждая из
  # которых создаёт релиз сама, — это гонка: на первом релизе она родила два
  # черновика на один тег, и во втором лежал один осиротевший блокмап.
  # electron-builder существующий черновик находит по тегу и доливает в него.
  draft:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "черновик $tag уже есть"
          else
            gh release create "$tag" --draft --title "$tag" --notes-file .github/release-notes.md
          fi

  build:
    needs: draft
    # Тег без черновика невозможен, а `workflow_dispatch` идёт без тега вовсе —
    # и пропущенная джоба остановила бы сборку молча.
    if: always() && needs.draft.result != 'failure'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Проверки перед упаковкой, а не после: собранный и выложенный черновик
      # с красными тестами — это релиз, который кто-то скачает.
      - run: npm run check
      # Подписи нет — это 5.2, сертификатов пока не существует. Здесь об этом
      # сказано вслух, потому что молчание читается как «подписано».
      - run: npm run -w @agentmeter/desktop release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
